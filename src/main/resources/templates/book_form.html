<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" th:href="@{/css/common.css}" />
    <link rel="stylesheet" th:href="@{/css/form.css}" />
    <link rel="stylesheet" th:href="@{/css/book_list.css}" />
    <link rel="stylesheet" th:href="@{/css/book_detail.css}" />
    <title>book review</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <a th:href="@{/showBookList}">書籍一覧</a>
        <a th:href="@{/toBookForm}">書籍を追加</a>
      </nav>
    </header>

    <h1>書籍を追加</h1>
    <div class="form-container">
      <form
        action="book_list.html"
        th:action="@{/addBook}"
        method="post"
        th:object="${bookForm}"
      >
        <div class="form-group">
          <label for="title">タイトル</label>
          <input type="text" name="title" id="title" th:field="*{title}" />
          <div class="error-message" th:errors="*{title}">
            タイトルを入力してください
          </div>
        </div>

        <div class="form-group">
          <label for="author">著者名</label>
          <input type="text" name="author" id="author" th:field="*{author}" />
          <div class="error-message" th:errors="*{author}">
            著者名を入力してください
          </div>
        </div>

        <div class="form-button">
          <button>追加</button>
        </div>
      </form>
    </div>
  </body>
</html>
